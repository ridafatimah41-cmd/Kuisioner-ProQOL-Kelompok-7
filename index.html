<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Jeda Guru: Cek Kesejahteraan Emosimu</title>
    <style>
        /* TEMA WARNA CERAH */
        :root {
            --primary: #FF6B6B;      
            --secondary: #4EA8DE;    
            --accent: #FFD166;       
            --bg-color: #FFFDF7;     
            --card-bg: #FFFFFF;
            --text-main: #2B2D42;
            --text-muted: #8D99AE;
        }

        body {
            font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 700px;
            width: 100%;
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(255, 107, 107, 0.15);
            position: relative;
            overflow: hidden;
        }

        /* Navigasi Halaman */
        .page {
            display: none;
            animation: slideIn 0.4s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
        }

        .page.active {
            display: block;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Tipografi & Elemen */
        h1 {
            color: var(--primary);
            font-size: 2.2em;
            text-align: center;
            margin-bottom: 15px;
            line-height: 1.2;
        }

        p {
            font-size: 1.1em;
            line-height: 1.7;
            text-align: center;
            color: var(--text-main);
        }

        .question-header {
            color: var(--text-muted);
            font-size: 0.9em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 1.3em;
            font-weight: 700;
            text-align: left;
            margin-bottom: 25px;
            color: var(--text-main);
            line-height: 1.5;
        }

        /* Tombol */
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 30px;
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.3);
        }

        .btn:hover {
            background-color: #FF5252;
            transform: translateY(-2px);
        }

        .btn:disabled {
            background-color: #E2E8F0;
            color: #94A3B8;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .btn-secondary {
            background-color: var(--secondary);
            box-shadow: 0 6px 20px rgba(78, 168, 222, 0.3);
        }

        .btn-secondary:hover {
            background-color: #3B82F6;
        }

        /* Progress Bar */
        #progress-container {
            display: none;
            width: 100%;
            height: 10px;
            background-color: #F1F5F9;
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background-color: var(--accent);
            width: 0%;
            transition: width 0.4s ease;
            border-radius: 10px;
        }

        /* Pilihan Jawaban */
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-label {
            padding: 16px 20px;
            border: 2px solid #E2E8F0;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
            text-align: left;
            background: #FAFAFA;
            font-size: 1.05em;
        }

        .option-label:hover {
            border-color: var(--secondary);
            background: #F0F9FF;
        }

        input[type="radio"] {
            display: none;
        }

        input[type="radio"]:checked + .option-label {
            background-color: var(--secondary);
            color: white;
            border-color: var(--secondary);
            box-shadow: 0 4px 15px rgba(78, 168, 222, 0.2);
        }

        /* Kartu Hasil */
        .result-card {
            text-align: center;
        }

        .result-score {
            font-size: 4em;
            font-weight: 900;
            color: var(--primary);
            margin: 10px 0;
            text-shadow: 2px 2px 0px var(--accent);
        }

        .result-title {
            font-size: 1.6em;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* Responsif */
        @media (max-width: 480px) {
            .container { padding: 30px 20px; }
            h1 { font-size: 1.8em; }
            .question-text { font-size: 1.1em; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Progress Bar -->
        <div id="progress-container">
            <div class="progress" id="progress"></div>
        </div>
        
        <!-- PAGE 1: JUDUL & HOOK -->
        <div id="page-intro" class="page active">
            <h1>Ruang Jeda Guru 🌻</h1>
            <p style="font-size: 1.2em; font-weight: bold; color: var(--secondary);">Lelah menjadi guru yang "terlalu peduli"?</p>
            <p>Kuesioner ini diadaptasi dari skala <strong>ProQOL 5.0 (Professional Quality of Life)</strong>. Jawablah 30 pertanyaan berikut berdasarkan apa yang kamu rasakan sebagai pendidik dalam 30 hari terakhir.</p>
            <button class="btn" onclick="startQuiz()">Mulai Refleksi Diri</button>
        </div>

        <!-- Wadah untuk Halaman Pertanyaan (Di-generate via JS) -->
        <div id="quiz-pages"></div>

        <!-- PAGE TERAKHIR: HASIL & POIN -->
        <div id="page-result" class="page">
            <div class="result-card">
                <p style="text-transform: uppercase; letter-spacing: 2px; color: var(--text-muted); font-size: 0.9em; margin-bottom: 0;">Total Poin Kamu</p>
                <div class="result-score" id="result-score">0</div>
                <h2 class="result-title" id="result-title"></h2>
                <p id="result-desc" style="margin-bottom: 30px;"></p>
                <button class="btn btn-secondary" onclick="location.reload()">Ulangi Kuis</button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            "1. Saya merasa bahagia.",
            "2. Saya terus memikirkan lebih dari satu orang/siswa yang saya dampingi.",
            "3. Saya mendapat kepuasan karena bisa mendampingi siswa.",
            "4. Saya merasa terhubung dengan orang lain.",
            "5. Saya mudah melompat atau terkejut oleh suara yang tidak terduga.",
            "6. Saya merasa bersemangat setelah bekerja dengan siswa yang saya dampingi.",
            "7. Saya merasa sulit memisahkan kehidupan pribadi dari kehidupan saya sebagai seorang guru.",
            "8. Saya kurang produktif di tempat kerja karena kurang tidur memikirkan pengalaman traumatis dari siswa yang saya dampingi.",
            "9. Saya pikir saya mungkin telah terpengaruh oleh stres traumatis dari siswa yang saya dampingi.",
            "10. Saya merasa terjebak oleh pekerjaan saya sebagai guru.",
            "11. Karena pekerjaan saya, saya merasa 'gelisah/tegang' tentang berbagai hal.",
            "12. Saya menyukai pekerjaan saya sebagai guru.",
            "13. Saya merasa depresi karena pengalaman traumatis dari orang/siswa yang saya dampingi.",
            "14. Saya merasa seolah-olah saya mengalami sendiri trauma dari seseorang yang telah saya dampingi.",
            "15. Saya memiliki keyakinan yang menguatkan saya.",
            "16. Saya senang dengan kemampuan saya dalam mengikuti teknik dan protokol pengajaran/pendampingan.",
            "17. Saya adalah sosok yang selalu saya inginkan.",
            "18. Pekerjaan saya membuat saya merasa puas.",
            "19. Saya merasa sangat lelah (habis tenaga) karena pekerjaan saya sebagai guru.",
            "20. Saya memiliki pikiran dan perasaan yang membahagiakan tentang siswa saya dan bagaimana saya bisa membantu mereka.",
            "21. Saya merasa kewalahan karena beban kerja saya tampaknya tidak ada habisnya.",
            "22. Saya percaya saya bisa membuat perubahan melalui pekerjaan saya.",
            "23. Saya menghindari aktivitas atau situasi tertentu karena mengingatkan saya pada pengalaman menakutkan dari siswa yang saya dampingi.",
            "24. Saya bangga dengan apa yang bisa saya lakukan untuk mendampingi siswa.",
            "25. Sebagai akibat dari pekerjaan saya, saya memiliki pikiran-pikiran menakutkan yang mengganggu.",
            "26. Saya merasa 'terhambat/terbebani' oleh sistem.",
            "27. Saya memiliki pemikiran bahwa saya 'sukses' sebagai guru.",
            "28. Saya tidak bisa mengingat bagian-bagian penting dari pekerjaan saya dengan korban trauma.",
            "29. Saya adalah orang yang sangat peduli.",
            "30. Saya senang karena telah memilih untuk melakukan pekerjaan ini."
        ];
        
        const optionsText = [
            { text: "1 - Tidak Pernah", value: 1 },
            { text: "2 - Jarang", value: 2 },
            { text: "3 - Kadang-kadang", value: 3 },
            { text: "4 - Sering", value: 4 },
            { text: "5 - Sangat Sering", value: 5 }
        ];

        let currentStep = -1; 
        let answers = [];

        function renderQuestions() {
            const container = document.getElementById('quiz-pages');
            questions.forEach((q, index) => {
                const pageDiv = document.createElement('div');
                pageDiv.className = 'page';
                pageDiv.id = `page-${index}`;
                
                let html = `<div class="question-header">Pertanyaan ${index + 1} / ${questions.length}</div>`;
                html += `<div class="question-text">${q}</div>`;
                html += `<div class="options">`;
                
                optionsText.forEach((opt) => {
                    html += `
                        <label>
                            <input type="radio" name="q${index}" value="${opt.value}" onchange="enableNextBtn(${index})">
                            <div class="option-label">${opt.text}</div>
                        </label>
                    `;
                });
                
                html += `</div>`;
                html += `<button class="btn btn-secondary" id="btn-next-${index}" disabled onclick="nextQuestion()">Selanjutnya</button>`;
                
                pageDiv.innerHTML = html;
                container.appendChild(pageDiv);
            });
        }

        function enableNextBtn(index) {
            document.getElementById(`btn-next-${index}`).disabled = false;
        }

        function startQuiz() {
            document.getElementById('page-intro').classList.remove('active');
            document.getElementById('progress-container').style.display = 'block';
            currentStep = 0;
            showPage();
        }

        function showPage() {
            document.querySelectorAll('#quiz-pages .page').forEach(p => p.classList.remove('active'));
            
            if (currentStep < questions.length) {
                document.getElementById(`page-${currentStep}`).classList.add('active');
                updateProgress();
            } else {
                showResult();
            }
        }

        function updateProgress() {
            const percentage = (currentStep / questions.length) * 100;
            document.getElementById('progress').style.width = percentage + '%';
        }

        function nextQuestion() {
            const selected = document.querySelector(`input[name="q${currentStep}"]:checked`);
            if (selected) {
                answers[currentStep] = parseInt(selected.value);
                currentStep++;
                showPage();
            }
        }

        function showResult() {
            document.getElementById('progress-container').style.display = 'none';
            document.getElementById('page-result').classList.add('active');
            
            const totalScore = answers.reduce((a, b) => a + b, 0);
            
            let scoreDisplay = document.getElementById('result-score');
            scoreDisplay.innerText = totalScore;
            
            const titleEl = document.getElementById('result-title');
            const descEl = document.getElementById('result-desc');
            
            // Rentang skor disesuaikan untuk 30 soal (Min: 30, Max: 150)
            if (totalScore <= 75) {
                titleEl.style.color = '#2ECC71'; 
                titleEl.innerText = "🌿 Tangki Empati Terjaga (Risiko Kelelahan Rendah)";
                descEl.innerHTML = "Luar biasa! Tingkat kepuasan kerjamu tampak lebih dominan dibanding kelelahan emosional. Pertahankan rutinitas <em>self-care</em> dan batasan sehat yang sudah kamu bangun. Anak-anak didikmu sangat beruntung memilikimu!";
            } else if (totalScore <= 110) {
                titleEl.style.color = '#F39C12'; 
                titleEl.innerText = "🌤️ Lampu Kuning (Risiko Kelelahan Sedang)";
                descEl.innerHTML = "Terima kasih sudah berani jujur. Kamu mungkin mulai merasakan beban dari tuntutan mengajar sehari-hari. Mulailah mengatur ulang ritme kerjamu dan luangkan waktu untuk dirimu sendiri sebelum kelelahan ini berujung pada <em>burnout</em>.";
            } else {
                titleEl.style.color = '#E74C3C'; 
                titleEl.innerText = "❤️ Tangki Kosong (Risiko Kelelahan Tinggi)";
                descEl.innerHTML = "Peluk hangat untukmu. Sangat wajar jika kamu merasa sangat kelelahan saat kamu sudah memberikan terlalu banyak cinta dan tenaga untuk orang lain. Tolong prioritaskan dirimu sekarang. Ambil jeda, dan pertimbangkan untuk berbicara dengan rekan tepercaya atau tenaga profesional.";
            }
        }

        renderQuestions();
    </script>
</body>
</html>
